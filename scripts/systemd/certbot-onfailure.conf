# Drop-in for the packaged certbot.service, rendered by scripts/deploy.sh and installed
# to /etc/systemd/system/certbot.service.d/<APP_NAME>-onfailure.conf. The per-app file
# name lets several apps on one host each attach their own alert: systemd merges
# OnFailure= across drop-ins.
#
# certbot.service already exits non-zero on a failed renewal; in the project this was
# ported from nothing was watching for it, which is how 66 consecutive failures went
# unnoticed until the certificate expired.
[Unit]
OnFailure=__APP_NAME__-alert-certbot.service
