name: ${COMPOSE_PROJECT_NAME:-flask-react-template}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      FLASK_ENV: development
      FLASK_RUN_HOST: '0.0.0.0'
      SECRET_KEY: change-me
      CORS_ALLOWED_ORIGINS: 'http://localhost:${FRONTEND_PORT:-5174}'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-http://localhost:${FRONTEND_PORT:-5174}}'
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-}
      UPLOAD_FOLDER: src_back/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    entrypoint: ['/bin/sh', 'docker/entrypoint.sh']
    volumes:
      - uploads_data:/app/src_back/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5174}:5173'
    environment:
      VITE_API_URL: http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
