# Production override: docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml
#
# Host nginx (scripts/nginx-ssl.conf.template) terminates TLS and proxies to the
# two loopback ports published here, so nothing but nginx is reachable from
# outside. `!reset` and `!override` replace the base file's port lists instead of
# merging with them (Docker Compose 2.24.4+).
services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: !reset []

  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Strict}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports: !override
      - '127.0.0.1:${BACKEND_PORT:-5000}:5000'

  frontend:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports: !override
      - '127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80'
    depends_on:
      - backend
