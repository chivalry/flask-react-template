# The production frontend image's server. Host nginx (scripts/nginx-ssl.conf.template)
# sits in front of it, sends the security headers, and throttles sign-in attempts, so
# this file does neither: headers added here as well would reach browsers twice.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # nginx rejects oversized bodies itself; answer with the application's JSON 413
    # envelope instead of the default HTML page. Browsers may still report a reset
    # on very large uploads because nginx closes the connection early.
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error": "File is too large. Maximum size is 25 MB."}';
    }

    # Whole-segment match, like the Flask 404 handler and the Vite proxy: bare
    # /api and /uploads reach the backend too, while /api-docs stays with the SPA.
    location ~ ^/(api|uploads)(/|$) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
