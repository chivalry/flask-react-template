name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Runs every job on a chosen branch from the Actions tab.
  workflow_dispatch:

jobs:
  backend:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: "--health-cmd pg_isready --health-interval 5s \
          --health-timeout 5s --health-retries 5"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          # The default key hashes only requirements.txt; the glob adds the dev file.
          cache-dependency-path: requirements*.txt

      # The venv mirrors local development, where every Python tool runs as
      # .venv/bin/<tool>, and it is where pyproject.toml tells basedpyright to look.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Ruff lint
        run: .venv/bin/ruff check src_back scripts

      - name: Ruff format check
        run: .venv/bin/ruff format --check src_back scripts

      - name: Docstring lint
        run: .venv/bin/pydoclint src_back scripts

      - name: Function length
        run: .venv/bin/python scripts/check_function_length.py src_back scripts

      - name: Type check
        run: .venv/bin/basedpyright

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app
          FLASK_ENV: testing
          SECRET_KEY: ci-secret
        run: .venv/bin/python -m pytest

  fallow:
    name: Fallow duplication audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs against the base branch, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Checkout does not set origin/HEAD, so fallow cannot auto-detect the base branch.
      - name: Fallow audit
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: npm run fallow -- --base "origin/$BASE_BRANCH"

  frontend:
    name: TypeScript lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Prettier check
        run: npx prettier --check .

      - name: markdownlint
        run: npm run lint:md

      - name: Vitest with coverage
        run: npm run test:front

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # run-all.sh checks every script's syntax with the shell its shebang names, then
      # runs scripts/tests/. The Compose test renders the stacks with the runner's
      # docker CLI and jq, and because Actions sets CI=true, a test that skips itself
      # fails the step.
      - name: Shell script checks
        run: bash scripts/tests/run-all.sh
